asyncapi: 3.0.0
id: urn:gogo-dl:websocket
info:
  title: gogo-dl WebSocket API
  version: 1.0.0
  description: |
    Realtime notifications for chat. This document describes the server's
    perspective: `receive` means a client sends a command to the server, and
    `send` means the server pushes an event to a client. Messages are JSON text.
    WebSocket delivery is best effort; use the REST API to read durable state.
    Each client command occupies one WebSocket frame. The server may batch
    several event envelopes into one text frame, separated by newline (`\n`).
    Parse each nonempty line as one JSON envelope.
    During shutdown, new upgrades are rejected with HTTP 503. Registered sockets
    receive close code 1001; slow sockets may be forcibly closed at the deadline.
    Reconnect with backoff and fetch durable history through REST.
defaultContentType: application/json
servers:
  local:
    host: localhost:8080
    protocol: ws
    description: Local development server.
    security:
      - $ref: '#/components/securitySchemes/bearerAuth'
      - $ref: '#/components/securitySchemes/queryToken'
  render:
    host: gogo-dl.onrender.com
    protocol: wss
    description: Render staging service.
    security:
      - $ref: '#/components/securitySchemes/bearerAuth'
      - $ref: '#/components/securitySchemes/queryToken'
channels:
  chat:
    address: /api/v1/ws
    description: |
      Upgrade a GET request to WebSocket with a valid access JWT. The handshake
      accepts `Authorization: Bearer <access_token>` or `?token=<access_token>`.
      Browsers commonly use the query parameter because the WebSocket API cannot
      set an Authorization header. The Origin must match `WS_ALLOWED_ORIGINS`
      when an Origin is sent; production rejects missing Origins by default.
      Obtain room membership through REST before sending `join`.
    messages:
      joinCommand:
        $ref: '#/components/messages/joinCommand'
      leaveCommand:
        $ref: '#/components/messages/leaveCommand'
      joined:
        $ref: '#/components/messages/joined'
      left:
        $ref: '#/components/messages/left'
      chatMessage:
        $ref: '#/components/messages/chatMessage'
      membershipChanged:
        $ref: '#/components/messages/membershipChanged'
      invitation:
        $ref: '#/components/messages/invitation'
      notification:
        $ref: '#/components/messages/notification'
      protocolError:
        $ref: '#/components/messages/protocolError'
operations:
  receiveCommands:
    action: receive
    channel:
      $ref: '#/channels/chat'
    summary: Receive room subscription commands from a client.
    description: |
      `join` subscribes this connection after a database membership check.
      `leave` removes only this connection's subscription. Neither command
      changes durable room membership. Client-sent `message` and other event
      types are rejected. Send chat content with POST /api/v1/rooms/{id}/messages.
    messages:
      - $ref: '#/channels/chat/messages/joinCommand'
      - $ref: '#/channels/chat/messages/leaveCommand'
  sendEvents:
    action: send
    channel:
      $ref: '#/channels/chat'
    summary: Push room and user notifications to connected clients.
    description: |
      Room events reach subscribed connections. Invitation events reach all
      active connections of the invited user, even without a room subscription.
      `error` goes to the affected connection. No event replay is provided;
      reconnect and fetch durable state through REST after a disconnect.
    messages:
      - $ref: '#/channels/chat/messages/joined'
      - $ref: '#/channels/chat/messages/left'
      - $ref: '#/channels/chat/messages/chatMessage'
      - $ref: '#/channels/chat/messages/membershipChanged'
      - $ref: '#/channels/chat/messages/invitation'
      - $ref: '#/channels/chat/messages/notification'
      - $ref: '#/channels/chat/messages/protocolError'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access JWT in the Authorization header; refresh JWTs are rejected.
    queryToken:
      type: httpApiKey
      name: token
      in: query
      description: Access JWT in the URL query, primarily for browser WebSocket clients. Treat URLs as sensitive.
  schemas:
    roomId:
      type: string
      pattern: '^[1-9][0-9]*$'
      description: Positive decimal int64 room ID, serialized as a string.
    connectionActor:
      type: object
      required: [user_id, client_id]
      properties:
        user_id:
          type: integer
          format: int64
        client_id:
          type: string
      additionalProperties: false
    messageData:
      type: object
      required: [id, user_id, username, content, created_at]
      properties:
        id:
          type: integer
          format: int64
        user_id:
          type: integer
          format: int64
        username:
          type: string
        content:
          type: string
        created_at:
          type: string
          format: date-time
      additionalProperties: false
    membershipData:
      type: object
      required: [action, user_id, actor_user_id, role]
      properties:
        action:
          type: string
          enum: [joined, left, removed, role_changed, ownership_transferred]
        user_id:
          type: integer
          format: int64
        actor_user_id:
          type: integer
          format: int64
        role:
          type: string
          enum: [owner, moderator, member]
      additionalProperties: false
    invitationData:
      type: object
      required: [invitation_id, action, status]
      properties:
        invitation_id:
          type: integer
          format: int64
        action:
          type: string
          const: created
        status:
          type: string
          const: pending
      additionalProperties: false
    errorData:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          enum:
            - invalid_command
            - payload_too_large
            - invalid_room_id
            - forbidden
            - authorization_failed
            - authorization_unavailable
            - unsupported_event
            - membership_revoked
        message:
          type: string
      additionalProperties: false
  messages:
    joinCommand:
      name: joinCommand
      title: Join a room subscription
      payload:
        type: object
        required: [type, room_id]
        properties:
          type:
            type: string
            const: join
          room_id:
            $ref: '#/components/schemas/roomId'
        additionalProperties: false
      examples:
        - payload: {type: join, room_id: '1'}
    leaveCommand:
      name: leaveCommand
      title: Leave a room subscription
      payload:
        type: object
        required: [type, room_id]
        properties:
          type:
            type: string
            const: leave
          room_id:
            $ref: '#/components/schemas/roomId'
        additionalProperties: false
      examples:
        - payload: {type: leave, room_id: '1'}
    joined:
      name: joined
      title: Connection joined a room subscription
      description: Broadcast to subscribed connections, including the joining connection.
      payload:
        type: object
        required: [type, room_id, payload]
        properties:
          type:
            type: string
            const: join
          room_id:
            $ref: '#/components/schemas/roomId'
          payload:
            $ref: '#/components/schemas/connectionActor'
        additionalProperties: false
      examples:
        - payload: {type: join, room_id: '1', payload: {user_id: 7, client_id: 'connection-1'}}
    left:
      name: left
      title: Connection left a room subscription
      description: Broadcast to remaining subscribers after a leave or disconnect.
      payload:
        type: object
        required: [type, room_id, payload]
        properties:
          type:
            type: string
            const: leave
          room_id:
            $ref: '#/components/schemas/roomId'
          payload:
            $ref: '#/components/schemas/connectionActor'
        additionalProperties: false
      examples:
        - payload: {type: leave, room_id: '1', payload: {user_id: 7, client_id: 'connection-1'}}
    chatMessage:
      name: chatMessage
      title: Persisted chat message
      description: Sent after POST /api/v1/rooms/{id}/messages persists the message.
      payload:
        type: object
        required: [type, room_id, payload]
        properties:
          type:
            type: string
            const: message
          room_id:
            $ref: '#/components/schemas/roomId'
          payload:
            $ref: '#/components/schemas/messageData'
        additionalProperties: false
      examples:
        - payload:
            type: message
            room_id: '1'
            payload: {id: 42, user_id: 7, username: alice, content: Hello!, created_at: '2026-01-01T12:00:00Z'}
    membershipChanged:
      name: membershipChanged
      title: Durable room membership changed
      description: Sent to subscribed connections after a REST membership mutation commits.
      payload:
        type: object
        required: [type, room_id, payload]
        properties:
          type:
            type: string
            const: membership_changed
          room_id:
            $ref: '#/components/schemas/roomId'
          payload:
            $ref: '#/components/schemas/membershipData'
        additionalProperties: false
      examples:
        - payload:
            type: membership_changed
            room_id: '1'
            payload: {action: joined, user_id: 7, actor_user_id: 7, role: member}
    invitation:
      name: invitation
      title: Room invitation created
      description: Sent to every active connection of the invited user.
      payload:
        type: object
        required: [type, room_id, payload]
        properties:
          type:
            type: string
            const: invitation
          room_id:
            $ref: '#/components/schemas/roomId'
          payload:
            $ref: '#/components/schemas/invitationData'
        additionalProperties: false
      examples:
        - payload:
            type: invitation
            room_id: '1'
            payload: {invitation_id: 12, action: created, status: pending}
    notification:
      name: notification
      title: Private mention notification
      description: Sent only to active connections of the notification recipient after durable inbox insertion.
      payload:
        type: object
        required: [type, room_id, payload]
        properties:
          type:
            type: string
            const: notification
          room_id:
            $ref: '#/components/schemas/roomId'
          payload:
            type: object
            required: [id, kind, room_id, message_id]
            properties:
              id: {type: integer, format: int64}
              kind: {type: string, const: mention}
              room_id: {type: integer, format: int64}
              message_id: {type: integer, format: int64}
        additionalProperties: false
      examples:
        - payload:
            type: notification
            room_id: '1'
            payload: {id: 9, kind: mention, room_id: 1, message_id: 42}
    protocolError:
      name: protocolError
      title: WebSocket command or subscription error
      description: |
        Sent to the affected connection. `room_id` may be empty for malformed
        frames. `payload_too_large` is followed by connection close;
        `membership_revoked` means the room subscription was removed.
      payload:
        type: object
        required: [type, room_id, payload]
        properties:
          type:
            type: string
            const: error
          room_id:
            type: string
          payload:
            $ref: '#/components/schemas/errorData'
        additionalProperties: false
      examples:
        - payload:
            type: error
            room_id: '1'
            payload: {code: forbidden, message: 'you are not allowed to access this room'}
