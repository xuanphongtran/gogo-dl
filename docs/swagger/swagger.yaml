basePath: /
definitions:
  github_com_xuanphongtran_gogo-dl_internal_middleware.TokenPair:
    properties:
      access_token:
        type: string
      expires_at:
        description: Unix timestamp of access token expiry
        type: integer
      refresh_token:
        type: string
    type: object
  github_com_xuanphongtran_gogo-dl_internal_ws.PresenceSnapshot:
    properties:
      online_user_ids:
        items:
          type: integer
        type: array
      room_id:
        type: string
      typing_user_ids:
        items:
          type: integer
        type: array
    type: object
  github_com_xuanphongtran_gogo-dl_pkg_apperror.AppError:
    properties:
      error:
        type: string
    type: object
  internal_chat.AdvanceReadStateRequest:
    properties:
      last_read_message_id:
        minimum: 1
        type: integer
    required:
    - last_read_message_id
    type: object
  internal_chat.ChangeMemberRoleRequest:
    properties:
      role:
        allOf:
        - $ref: '#/definitions/internal_chat.RoomRole'
        enum:
        - member
        - moderator
    required:
    - role
    type: object
  internal_chat.CreateRoomRequest:
    properties:
      name:
        maxLength: 100
        minLength: 1
        type: string
      visibility:
        allOf:
        - $ref: '#/definitions/internal_chat.RoomVisibility'
        enum:
        - public
        - private
    required:
    - name
    type: object
  internal_chat.EditMessageRequest:
    properties:
      content:
        description: Content must be nonblank and at most 4000 UTF-8 bytes after trimming
          whitespace.
        maxLength: 4000
        minLength: 1
        type: string
      revision:
        minimum: 1
        type: integer
    required:
    - content
    - revision
    type: object
  internal_chat.Invitation:
    properties:
      created_at:
        type: string
      id:
        type: integer
      invited_by:
        type: integer
      invitee_id:
        type: integer
      responded_at:
        type: string
      room_id:
        type: integer
      room_name:
        type: string
      status:
        $ref: '#/definitions/internal_chat.InvitationStatus'
      updated_at:
        type: string
    type: object
  internal_chat.InvitationStatus:
    enum:
    - pending
    - accepted
    - declined
    type: string
    x-enum-varnames:
    - InvitationPending
    - InvitationAccepted
    - InvitationDeclined
  internal_chat.InvitationsResponse:
    properties:
      invitations:
        items:
          $ref: '#/definitions/internal_chat.Invitation'
        type: array
    type: object
  internal_chat.InviteUserRequest:
    properties:
      user_id:
        minimum: 1
        type: integer
    required:
    - user_id
    type: object
  internal_chat.JoinResponse:
    properties:
      message:
        type: string
    type: object
  internal_chat.MembersResponse:
    properties:
      members:
        items:
          $ref: '#/definitions/internal_chat.RoomMember'
        type: array
    type: object
  internal_chat.Message:
    properties:
      content:
        type: string
      created_at:
        type: string
      deleted_at:
        format: date-time
        type: string
        x-nullable: true
      edited_at:
        format: date-time
        type: string
        x-nullable: true
      id:
        type: integer
      revision:
        minimum: 1
        type: integer
      room_id:
        type: integer
      user_id:
        type: integer
        x-nullable: true
      username:
        description: joined from users table
        type: string
    type: object
  internal_chat.MessagesResponse:
    properties:
      messages:
        items:
          $ref: '#/definitions/internal_chat.Message'
        type: array
    type: object
  internal_chat.ReadState:
    properties:
      last_read_message_id:
        minimum: 0
        type: integer
      room_id:
        type: integer
      unread_count:
        minimum: 0
        type: integer
    type: object
  internal_chat.Room:
    properties:
      created_at:
        type: string
      created_by:
        type: integer
      id:
        type: integer
      name:
        type: string
      role:
        allOf:
        - $ref: '#/definitions/internal_chat.RoomRole'
        x-nullable: true
      visibility:
        $ref: '#/definitions/internal_chat.RoomVisibility'
    type: object
  internal_chat.RoomMember:
    properties:
      joined_at:
        type: string
      role:
        $ref: '#/definitions/internal_chat.RoomRole'
      room_id:
        type: integer
      user_id:
        type: integer
      username:
        type: string
    type: object
  internal_chat.RoomRole:
    enum:
    - owner
    - moderator
    - member
    type: string
    x-enum-varnames:
    - RoomRoleOwner
    - RoomRoleModerator
    - RoomRoleMember
  internal_chat.RoomVisibility:
    enum:
    - public
    - private
    type: string
    x-enum-varnames:
    - RoomVisibilityPublic
    - RoomVisibilityPrivate
  internal_chat.RoomsResponse:
    properties:
      rooms:
        items:
          $ref: '#/definitions/internal_chat.Room'
        type: array
    type: object
  internal_chat.SearchMessagesResponse:
    properties:
      messages:
        items:
          $ref: '#/definitions/internal_chat.Message'
        type: array
      next_before:
        type: integer
        x-nullable: true
    type: object
  internal_chat.SendMessageRequest:
    properties:
      content:
        description: Content must be nonblank and at most 4000 UTF-8 bytes after trimming
          whitespace.
        maxLength: 4000
        minLength: 1
        type: string
    required:
    - content
    type: object
  internal_chat.TransferOwnershipRequest:
    properties:
      user_id:
        minimum: 1
        type: integer
    required:
    - user_id
    type: object
  internal_httpserver.HealthResponse:
    properties:
      status:
        type: string
      time:
        type: string
    type: object
  internal_httpserver.LivenessResponse:
    properties:
      live:
        type: boolean
    type: object
  internal_httpserver.ReadinessResponse:
    properties:
      ready:
        type: boolean
    type: object
  internal_user.LoginRequest:
    properties:
      email:
        type: string
      password:
        type: string
    required:
    - email
    - password
    type: object
  internal_user.ProfileResponse:
    properties:
      avatar_url:
        type: string
      created_at:
        type: string
      email:
        type: string
      id:
        type: integer
      username:
        type: string
    type: object
  internal_user.RefreshTokenRequest:
    properties:
      refresh_token:
        type: string
    required:
    - refresh_token
    type: object
  internal_user.RegisterRequest:
    properties:
      email:
        type: string
      password:
        minLength: 8
        type: string
      username:
        maxLength: 50
        minLength: 3
        type: string
    required:
    - email
    - password
    - username
    type: object
  internal_user.UpdateProfileRequest:
    properties:
      avatar_url:
        type: string
      username:
        maxLength: 50
        minLength: 3
        type: string
    type: object
host: localhost:8080
info:
  contact: {}
  description: REST API for the Gogo DL real-time chat backend.
  title: Gogo DL API
  version: "1.0"
paths:
  /api/v1/auth/login:
    post:
      consumes:
      - application/json
      parameters:
      - description: Login credentials
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_user.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_xuanphongtran_gogo-dl_internal_middleware.TokenPair'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_xuanphongtran_gogo-dl_pkg_apperror.AppError'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_xuanphongtran_gogo-dl_pkg_apperror.AppError'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/github_com_xuanphongtran_gogo-dl_pkg_apperror.AppError'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_xuanphongtran_gogo-dl_pkg_apperror.AppError'
      summary: Login and get JWT token pair
      tags:
      - auth
  /api/v1/auth/refresh:
