            $ref: '#/definitions/github_com_xuanphongtran_gogo-dl_pkg_apperror.AppError'
      security:
      - BearerAuth: []
      summary: Leave a room
      tags:
      - memberships
  /api/v1/rooms/{id}/messages:
    get:
      parameters:
      - description: Room ID
        in: path
        name: id
        required: true
        type: integer
      - default: 50
        description: Page size
        in: query
        maximum: 100
        minimum: 1
        name: limit
        type: integer
      - description: Return messages with IDs below this cursor
        in: query
        minimum: 1
        name: before
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_chat.MessagesResponse'
        "400":
